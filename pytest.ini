[pytest]
# Pin pytest to THIS project. Without an ini file, pytest walks upward from
# tests/ looking for packages, and a stray __init__.py in a parent folder
# (e.g. C:\Users\<you>\Downloads\__init__.py) gets imported as a package and
# breaks every test. With this file, the project folder is the rootdir and
# nothing above it is touched.
testpaths = tests
pythonpath = . tests
addopts = -p no:cacheprovider
